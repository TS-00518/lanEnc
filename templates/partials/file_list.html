{% if files %}
    {% for file in files %}
    <div class="group flex items-center justify-between p-4 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/5 hover:border-white/20 transition-all duration-300 backdrop-blur-sm">
        <div class="flex items-center gap-4 overflow-hidden">
            <div class="w-10 h-10 rounded-xl bg-black/40 flex items-center justify-center text-slate-500 group-hover:text-indigo-400 transition-colors border border-white/5">
                <i class="fas fa-video text-sm"></i>
            </div>
            <div class="flex flex-col overflow-hidden">
                <span class="truncate text-base text-slate-300 font-light group-hover:text-white transition-colors tracking-wide" title="{{ file }}">{{ file }}</span>
            </div>
        </div>
        
        <div class="flex items-center gap-2 flex-shrink-0">
            <!-- Add to Queue -->
            <form hx-post="/add" hx-swap="none"
                  onclick="this.closest('.group').classList.add('flash-white'); setTimeout(() => this.closest('.group').classList.remove('flash-white'), 500)">
                <input type="hidden" name="filename" value="{{ file }}">
                <button type="submit" class="w-10 h-10 rounded-xl bg-white/5 hover:bg-emerald-500/20 text-slate-400 hover:text-emerald-200 flex items-center justify-center transition-all duration-300 border border-white/5 hover:border-emerald-500/30" title="Add to Queue">
                    <i class="fas fa-plus text-xs"></i>
                </button>
            </form>

            <!-- Delete File (Instant Delete) -->
            <form hx-post="/delete_upload" hx-target="#file-list" hx-swap="innerHTML">
                <input type="hidden" name="filename" value="{{ file }}">
                <button type="submit" class="w-10 h-10 rounded-xl bg-white/5 hover:bg-red-500/20 text-slate-400 hover:text-red-300 flex items-center justify-center transition-all duration-300 border border-white/5 hover:border-red-500/30" title="Delete File">
                    <i class="fas fa-trash text-xs"></i>
                </button>
            </form>
        </div>
    </div>
    {% endfor %}
{% else %}
    <div class="flex flex-col items-center justify-center h-full text-slate-600 gap-6">
        <i class="fas fa-cloud-upload-alt text-5xl opacity-10"></i>
        <span class="text-sm font-light tracking-wide">No files uploaded yet</span>
    </div>
{% endif %}
