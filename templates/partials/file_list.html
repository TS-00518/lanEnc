{% if files %}
    {% for file in files %}
    <div class="item-card flex items-center justify-between p-4 group" role="listitem">
        <div class="flex items-center gap-4 overflow-hidden relative z-10">
            <div class="w-10 h-10 rounded-xl bg-black/40 flex items-center justify-center text-slate-500 group-hover:text-indigo-400 transition-colors border border-white/5">
                <i class="fas fa-video text-sm"></i>
            </div>
            <div class="flex flex-col overflow-hidden">
                <span class="truncate text-base text-slate-300 font-light group-hover:text-white transition-colors tracking-wide" title="{{ file }}">{{ file }}</span>
            </div>
        </div>
        
        <div class="flex items-center gap-2 flex-shrink-0 relative z-10">
            <form hx-post="/add" hx-swap="none" data-action="flash-card">
                <input type="hidden" name="filename" value="{{ file }}">
                <button type="submit" class="w-10 h-10 rounded-xl bg-white/5 hover:bg-emerald-500/20 text-slate-400 hover:text-emerald-200 flex items-center justify-center transition-all duration-300 border border-white/5 hover:border-emerald-500/30" aria-label="Add to Queue" title="Add to Queue">
                    <i class="fas fa-plus text-xs pointer-events-none"></i>
                </button>
            </form>

            <form hx-post="/delete_upload" hx-target="#file-list" hx-swap="innerHTML">
                <input type="hidden" name="filename" value="{{ file }}">
                <button type="submit" class="w-10 h-10 rounded-xl bg-white/5 hover:bg-red-500/20 text-slate-400 hover:text-red-300 flex items-center justify-center transition-all duration-300 border border-white/5 hover:border-red-500/30" aria-label="Delete File" title="Delete File">
                    <i class="fas fa-trash text-xs pointer-events-none"></i>
                </button>
            </form>
        </div>
    </div>
    {% endfor %}
{% else %}
    <div class="flex flex-col items-center justify-center h-full text-slate-600 gap-6">
        <i class="fas fa-cloud-upload-alt text-5xl opacity-10"></i>
        <span class="text-sm font-light tracking-wide">No files uploaded yet</span>
    </div>
{% endif %}
